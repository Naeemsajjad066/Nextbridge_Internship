<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen flex bg-slate-300 justify-center items-center ">
    <!-- Calculator -->
    <div class="w-[340px] bg-white rounded-2xl shadow-xl p-5">
        <!-- Display -->
        <div id="display"
            class="bg-slate-900 text-white text-5xl text-right px-4 py-6 rounded-xl h-24 flex items-end justify-end overflow-x-auto">
            0
        </div>
        <!-- Buttons Grid -->
        <div id="buttons" class="grid grid-cols-4 gap-3 mt-5">

            <!-- First Row -->
            <button data-action="clear"
                class="bg-red-500 text-white p-4 rounded-xl text-xl font-semibold hover:bg-red-600 active:scale-95 transition">
                AC
            </button>

            <button data-action="delete"
                class="bg-slate-200 p-4 rounded-xl text-xl font-semibold hover:bg-slate-300 active:scale-95 transition">
                ⌫
            </button>

            <button data-value="%"
                class="bg-orange-500 text-white p-4 rounded-xl text-xl font-semibold hover:bg-orange-600 active:scale-95 transition">
                %
            </button>

            <button data-value="/"
                class="bg-orange-500 text-white p-4 rounded-xl text-xl font-semibold hover:bg-orange-600 active:scale-95 transition">
                ÷
            </button>

            <!-- Second Row -->
            <button data-value="7"
                class="bg-slate-200 p-4 rounded-xl text-xl font-semibold hover:bg-slate-300 active:scale-95 transition">
                7
            </button>

            <button data-value="8"
                class="bg-slate-200 p-4 rounded-xl text-xl font-semibold hover:bg-slate-300 active:scale-95 transition">
                8
            </button>

            <button data-value="9"
                class="bg-slate-200 p-4 rounded-xl text-xl font-semibold hover:bg-slate-300 active:scale-95 transition">
                9
            </button>

            <button data-value="*"
                class="bg-orange-500 text-white p-4 rounded-xl text-xl font-semibold hover:bg-orange-600 active:scale-95 transition">
                ×
            </button>

            <!-- Third Row -->
            <button data-value="4"
                class="bg-slate-200 p-4 rounded-xl text-xl font-semibold hover:bg-slate-300 active:scale-95 transition">
                4
            </button>

            <button data-value="5"
                class="bg-slate-200 p-4 rounded-xl text-xl font-semibold hover:bg-slate-300 active:scale-95 transition">
                5
            </button>

            <button data-value="6"
                class="bg-slate-200 p-4 rounded-xl text-xl font-semibold hover:bg-slate-300 active:scale-95 transition">
                6
            </button>

            <button data-value="-"
                class="bg-orange-500 text-white p-4 rounded-xl text-xl font-semibold hover:bg-orange-600 active:scale-95 transition">
                -
            </button>

            <!-- Fourth Row -->
            <button data-value="1"
                class="bg-slate-200 p-4 rounded-xl text-xl font-semibold hover:bg-slate-300 active:scale-95 transition">
                1
            </button>

            <button data-value="2"
                class="bg-slate-200 p-4 rounded-xl text-xl font-semibold hover:bg-slate-300 active:scale-95 transition">
                2
            </button>

            <button data-value="3"
                class="bg-slate-200 p-4 rounded-xl text-xl font-semibold hover:bg-slate-300 active:scale-95 transition">
                3
            </button>

            <button data-value="+"
                class="bg-orange-500 text-white p-4 rounded-xl text-xl font-semibold hover:bg-orange-600 active:scale-95 transition">
                +
            </button>

            <!-- Last Row -->
            <button data-value="0"
                class="col-span-2 bg-slate-200 p-4 rounded-xl text-xl font-semibold hover:bg-slate-300 active:scale-95 transition">
                0
            </button>

            <button data-value="."
                class="bg-slate-200 p-4 rounded-xl text-xl font-semibold hover:bg-slate-300 active:scale-95 transition">
                .
            </button>

            <button data-action="calculate"
                class="bg-blue-600 text-white p-4 rounded-xl text-xl font-semibold hover:bg-blue-700 active:scale-95 transition">
                =
            </button>

        </div>
    </div>
    <script src="script.js"></script>

</body>

</html>
