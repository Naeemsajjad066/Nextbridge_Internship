<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive-Navbar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-500 m-0">
    <header class="sticky top-0 z-50">
        <nav class="bg-white shadow-sm mt-1">
            <!-- Desktop bar -->
            <div class="max-w-7xl mx-auto flex items-center justify-between px-8 py-4">

                <a href="#" class="text-2xl font-bold text-slate-800">Naeem</a>

                <!-- Desktop links -->
                <ul class="hidden md:flex items-center gap-16 text-slate-700 font-medium">
                    <li><a href="#" class="hover:text-blue-600 hover:border-b-2 hover:border-blue-500 transition-colors">Home</a></li>
                    <li><a href="#" class="hover:text-blue-600 hover:border-b-2 hover:border-blue-500 transition-colors">About</a></li>
                    <li><a href="#" class="hover:text-blue-600 hover:border-b-2 hover:border-blue-500 transition-colors">Services</a></li>
                    <li><a href="#" class="hover:text-blue-600 hover:border-b-2 hover:border-blue-500 transition-colors">Contact</a></li>
                </ul>

                <!-- Desktop login -->
                <a href="#" class="hidden md:block bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700 transition-colors">
                    Login
                </a>

                <!-- Hamburger button -->
                <button id="menu-btn" class="md:hidden flex flex-col justify-center items-center w-9 h-9 gap-1.5 rounded-lg hover:bg-slate-100 transition-colors" aria-label="Toggle menu">
                    <span class="block w-5 h-0.5 bg-slate-700"></span>
                    <span class="block w-5 h-0.5 bg-slate-700"></span>
                    <span class="block w-5 h-0.5 bg-slate-700"></span>
                </button>

            </div>

            <!-- Mobile Menu -->
            <div id="mobile-menu" class="mobile-closed border-t border-slate-100">
                <ul class="flex flex-col px-4 py-3 gap-1">
                    <li>
                        <a href="#" class="block px-4 py-2.5 rounded-lg text-slate-700 font-medium hover:bg-blue-50 hover:text-blue-600 transition-colors">
                            Home
                        </a>
                    </li>
                    <li>
                        <a href="#" class="block px-4 py-2.5 rounded-lg text-slate-700 font-medium hover:bg-blue-50 hover:text-blue-600 transition-colors">
                            About
                        </a>
                    </li>
                    <li>
                        <a href="#" class="block px-4 py-2.5 rounded-lg text-slate-700 font-medium hover:bg-blue-50 hover:text-blue-600 transition-colors">
                            Services
                        </a>
                    </li>
                    <li>
                        <a href="#" class="block px-4 py-2.5 rounded-lg text-slate-700 font-medium hover:bg-blue-50 hover:text-blue-600 transition-colors">
                            Contact
                        </a>
                    </li>
                </ul>
                <div class="px-4 pb-4">
                    <a href="#" class="block w-full text-center bg-blue-600 text-white px-4 py-2.5 rounded-lg font-medium hover:bg-blue-700 transition-colors">
                        Login
                    </a>
                </div>
            </div>

        </nav>
    </header>

    <main>
        <section class="min-h-[510px] w-[100vw] bg-slate-500 flex items-center justify-center px-6">
            <div class="text-center max-w-2xl">
                <p class="text-blue-200 text-sm font-semibold uppercase tracking-widest mb-4">Welcome to my portfolio</p>
                <h1 class="text-4xl md:text-6xl font-bold text-white leading-tight mb-6">
                    Building Ideas Into <span class="text-blue-300">Reality</span>
                </h1>
                <p class="text-slate-200 text-lg md:text-xl mb-8 leading-relaxed">
                    I'm Naeem — a web developer who crafts clean, responsive, and modern web experiences.
                </p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <a href="#" class="bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors">
                        View My Work
                    </a>
                    <a href="#" class="border-2 border-white text-white px-8 py-3 rounded-lg font-semibold hover:bg-white hover:text-slate-700 transition-colors">
                        Contact Me
                    </a>
                </div>
            </div>
        </section>
    </main>

    <style>
        .mobile-closed { display: none; }
    </style>

    <script>
        const menuBtn = document.getElementById("menu-btn");
        const mobileMenu = document.getElementById("mobile-menu");

        menuBtn.addEventListener("click", function () {
            mobileMenu.classList.toggle("mobile-closed");
        });
    </script>

</body>
</html>
