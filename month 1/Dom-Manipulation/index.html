<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Manipulation</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">

    <main class="min-h-screen flex items-center bg-slate-200 justify-center p-4">

        <div class="w-full max-w-xl bg-white rounded-xl shadow-lg p-6">

            <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
                DOM Manipulation
            </h1>

            <div class="flex gap-3 mb-6">
                <input
                    type="text"
                    id="task"
                    maxlength="50"
                    placeholder="Enter a task..."
                    class="flex-1 border border-gray-300 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                />

                <button
                    id="addBtn"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg transition">
                    Add
                </button>
            </div>

            <ul
                id="list"
                class="space-y-3 max-h-80 overflow-y-auto">
            </ul>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
